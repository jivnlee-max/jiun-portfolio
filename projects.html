<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work — Jiun Lee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .page-hero {
      padding: 64px var(--pad) 48px;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .page-title {
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    /* Filter */
    .filter-bar {
      padding: 0 var(--pad);
      border-bottom: 0.5px solid var(--border);
      display: flex;
      gap: 0;
      overflow-x: auto;
    }

    .filter-btn {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: none;
      border-right: 0.5px solid var(--border);
      padding: 14px 22px;
      cursor: pointer;
      white-space: nowrap;
      transition: color var(--transition);
    }

    .filter-btn:first-child { padding-left: 0; }
    .filter-btn:hover { color: var(--fg); }
    .filter-btn.active { color: var(--fg); }

    /* Grid */
    .full-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--gap);
      background: var(--border);
    }

    .grid-item {
      position: relative;
      overflow: hidden;
      background: var(--bg);
      cursor: pointer;
      display: block;
    }

    .grid-thumb {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--bg-card);
      overflow: hidden;
    }

    .grid-thumb img,
    .grid-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .grid-item:hover .grid-thumb img,
    .grid-item:hover .grid-thumb video { transform: scale(1.04); }

    .thumb-placeholder {
      width: 100%;
      height: 100%;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .grid-info {
      padding: 14px 18px 18px;
      border-top: 0.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .grid-name {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.3;
    }

    .grid-meta-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .grid-tag {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .grid-year-label {
      font-size: 10px;
      color: var(--muted);
    }

    .grid-arrow-corner {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 26px;
      height: 26px;
      border: 0.5px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .grid-item:hover .grid-arrow-corner { opacity: 1; }
    .grid-item[data-hidden="true"] { display: none; }

    @media (max-width: 768px) {
      .full-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .full-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">Jiun Lee</a>
    <ul class="nav-links">
      <li><a href="projects.html" class="active">Work</a></li>
      <li><a href="info.html">Info</a></li>
    </ul>
  </nav>

  <main class="page">

    <div class="page-hero reveal">
      <h1 class="page-title">Selected work</h1>
      <span class="label" id="count-label"></span>
    </div>

    <!-- 카테고리 순서: All > Editorial > Campaign > AI Visual > Film > Photography -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="Editorial">Editorial</button>
      <button class="filter-btn" data-filter="Campaign">Campaign</button>
      <button class="filter-btn" data-filter="Film">Film</button>
      <button class="filter-btn" data-filter="Photography">Photography</button>
      <button class="filter-btn" data-filter="AI Visual">AI Visual</button>
    </div>

    <div class="full-grid" id="projects-grid"></div>

    <footer>
      <span class="label">© 2026 Jiun Lee</span>
      <ul class="footer-links">
        <li><a href="https://instagram.com/jivn.lee" target="_blank">Instagram</a></li>
      </ul>
    </footer>

  </main>

  <script src="js/media-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    var grid = document.getElementById('projects-grid');

    PROJECTS.forEach(function(p, i) {
      var item = document.createElement('a');
      item.className = 'grid-item reveal';
      item.href = 'project-detail.html?id=' + i;
      item.dataset.category = p.category;

      var thumb = buildThumb(p);
      item.innerHTML =
        thumb +
        '<div class="grid-info">' +
          '<span class="grid-name">' + p.title + '</span>' +
          '<div class="grid-meta-right">' +
            '<span class="grid-tag">' + p.category + '</span>' +
            '<span class="grid-year-label">' + (p.year||'') + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="grid-arrow-corner">↗</div>';

      grid.appendChild(item);
    });

    document.getElementById('count-label').textContent = PROJECTS.length + ' projects';

    document.querySelectorAll('.filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        var f = btn.dataset.filter;
        document.querySelectorAll('#projects-grid .grid-item').forEach(function(el) {
          el.dataset.hidden = (f !== 'all' && el.dataset.category !== f) ? 'true' : 'false';
        });
      });
    });

    initReveal();
  </script>
</body>
</html>
